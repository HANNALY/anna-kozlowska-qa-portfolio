
name: Coffee Cart - Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - "automation/Playwright/qa_pw_coffee_cart_pom_ts/**"
  pull_request:
    branches: [main]
    paths:
      - "automation/Playwright/qa_pw_coffee_cart_pom_ts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run UI and API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automation/Playwright/qa_pw_coffee_cart_pom_ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/Playwright/qa_pw_coffee_cart_pom_ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coffee-cart-playwright-report
          path: automation/Playwright/qa_pw_coffee_cart_pom_ts/playwright-report/
          retention-days: 14

      - name: Upload test results and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coffee-cart-test-results
          path: automation/Playwright/qa_pw_coffee_cart_pom_ts/test-results/
          retention-days: 7
