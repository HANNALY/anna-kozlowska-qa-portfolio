
name: ParaBank - Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - "automation/Playwright/ParaBank/**"
      - "automation/Playwright/ai-qa-agent/**"
      - ".github/workflows/parabank-playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "automation/Playwright/ParaBank/**"
      - "automation/Playwright/ai-qa-agent/**"
      - ".github/workflows/parabank-playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run ParaBank UI tests and AI QA analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automation/Playwright/ParaBank

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/Playwright/ParaBank/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright_tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parabank-playwright-report
          path: automation/Playwright/ParaBank/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parabank-test-results
          path: |
            automation/Playwright/ParaBank/test-results/
            automation/Playwright/ParaBank/reports/test-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Install AI QA Agent dependencies
        id: install_ai_agent
        if: always()
        working-directory: automation/Playwright/ai-qa-agent
        run: npm ci

      - name: Analyze ParaBank test results
        id: analyze
        if: always() && steps.install_ai_agent.outcome == 'success'
        working-directory: automation/Playwright/ai-qa-agent
        run: npm run analyze
        env:
          QA_REPORT_PATH: ../ParaBank/reports/test-results.json

      - name: Upload AI QA analysis
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parabank-ai-qa-analysis
          path: automation/Playwright/ai-qa-agent/reports/qa-analysis.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check pipeline result
        if: always()
        run: |
          if [ "${{ steps.playwright_tests.outcome }}" != "success" ] || \
             [ "${{ steps.install_ai_agent.outcome }}" != "success" ] || \
             [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "Playwright tests or AI QA analysis failed."
            exit 1
          fi
          echo "Playwright tests and AI QA analysis completed successfully."
