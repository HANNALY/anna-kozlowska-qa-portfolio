name: ParaBank - Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - "automation/Playwright/ParaBank/**"
      - ".github/workflows/parabank-playwright.yml"
  pull_request:
    branches: [main]
    paths:
      - "automation/Playwright/ParaBank/**"
      - ".github/workflows/parabank-playwright.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run ParaBank UI tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automation/Playwright/ParaBank

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/Playwright/ParaBank/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: parabank-playwright-report
          path: automation/Playwright/ParaBank/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: parabank-test-results
          path: automation/Playwright/ParaBank/test-results/
          if-no-files-found: ignore
          retention-days: 7
